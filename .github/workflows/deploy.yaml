name: Test, Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do not cancel in-progress deployments so live site updates complete cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Analyze, Test & Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart & Flutter code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Flutter Web (release)
        run: |
          flutter build web --release --base-href "/cotsworth_calendar_app/" \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }} \
            --dart-define=APP_PUBLIC_BASE_URL=${{ secrets.APP_PUBLIC_BASE_URL }} \
            --dart-define=FIRESTORE_USERS_COLLECTION=${{ secrets.FIRESTORE_USERS_COLLECTION || 'users' }} \
            --dart-define=AUTH_ALLOW_GUEST_MODE=${{ secrets.AUTH_ALLOW_GUEST_MODE || 'true' }} \
            --dart-define=AUTH_MIN_PASSWORD_LENGTH=${{ secrets.AUTH_MIN_PASSWORD_LENGTH || '6' }}

      - name: Add 404.html fallback for SPA routing
        run: cp build/web/index.html build/web/404.html

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
